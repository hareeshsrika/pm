<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Management MVP</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #032147;
        background: #f7f8fb;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(90vw, 560px);
        padding: 2.5rem;
        border: 1px solid rgb(3 33 71 / 10%);
        border-radius: 1.5rem;
        background: white;
        box-shadow: 0 18px 40px rgb(3 33 71 / 12%);
      }

      h1 {
        margin-top: 0;
      }

      #api-response {
        color: #209dd7;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Project Management MVP</h1>
      <p>The backend is running and serving this example page.</p>
      <p id="api-response">Checking the API...</p>
    </main>
    <script>
      fetch("/api/hello")
        .then((response) => {
          if (!response.ok) throw new Error("API request failed");
          return response.json();
        })
        .then((data) => {
          document.querySelector("#api-response").textContent = data.message;
        })
        .catch(() => {
          document.querySelector("#api-response").textContent = "API request failed";
        });
    </script>
  </body>
</html>
